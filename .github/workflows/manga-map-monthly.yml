name: Monthly Manga Map Refresh

on:
  schedule:
    - cron: '15 4 1 * *'   # 1st of month 04:15 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Download + decompress MangaBaka dump
        run: |
          curl -fL -o series.full.sqlite.zst https://api.mangabaka.org/v1/database/series.full.sqlite.zst
          unzstd -f series.full.sqlite.zst
          # Keep the raw compressed dump — it's published as a release
          # asset below so the map can be rebuilt even if MangaBaka's
          # upstream dump disappears.

      - name: Build manga map artifact
        run: node --experimental-sqlite scripts/build-manga-map.mjs series.full.sqlite dist

      - name: Checksum raw dump for release
        run: |
          mkdir -p dist
          sha256sum series.full.sqlite.zst > dist/series.full.sqlite.zst.sha256
          cp series.full.sqlite.zst dist/series.full.sqlite.zst

      - name: Update miko.json mangaDb block
        run: |
          node scripts/update-manga-sidecar.mjs

      - name: Commit manifest changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add miko.json
          git diff --staged --quiet || git commit -m "Manga map refresh: $(date -u '+%Y-%m-%d')"
          git push

      - name: Publish artifact to db-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view db-latest >/dev/null 2>&1 || \
            gh release create db-latest --title "MikoDB artifact" --notes "Rolling release for Miko identity mapping databases."
          gh release upload db-latest dist/miko-manga-map.db.gz --clobber
          # Raw MangaBaka input dump + checksum — rebuild input survives
          # upstream loss (Phase 12-03 hardening).
          gh release upload db-latest dist/series.full.sqlite.zst --clobber
          gh release upload db-latest dist/series.full.sqlite.zst.sha256 --clobber
